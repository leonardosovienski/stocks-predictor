[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stocks-predictor"
version = "0.1.0"
description = "B3 predictor research domain; active research line: predictor-rj"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "PyYAML>=6.0,<7",
  "predictor-core>=2.3,<3",
  "predictor-ops>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.entry-points."predictor.plugins"]
stocks = "src.ecosystem_plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
# A adoção do Ruff começa pelos erros objetivos de código (F*). Reformatar
# o acervo histórico inteiro não faz parte desta migração de infraestrutura.
select = ["F"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
# O gate começa na linha científica ativa RJ; ampliar cobertura é trabalho
# posterior e não deve alterar o experimento para satisfazer uma migração.
include = ["src/rj_episodes.py", "src/rj_families.py", "src/rj_judge.py"]
# O código RJ usa dicionários heterogêneos deliberadamente. Os três erros
# iniciais de argument type são dívida de anotação, não falhas funcionais; o
# restante do basic type-check continua ativo nesta etapa.
reportArgumentType = "none"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.uv.sources]
predictor-core = { url = "https://github.com/leonardosovienski/core-predictor/releases/download/v2.3.0/predictor_core-2.3.0-py3-none-any.whl" }
predictor-ops = { url = "https://github.com/leonardosovienski/predictor-ops/releases/download/v3.1.0/predictor_ops-3.1.0-py3-none-any.whl" }
