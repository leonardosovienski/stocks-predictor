[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "stocks-predictor"
version = "0.1.0"
description = "B3 equity research and evidence-gated historical simulation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "PyYAML>=6.0,<7",
  "predictor-core>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.entry-points."predictor.plugins"]
stocks = "stocks_predictor.ecosystem_plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["stocks_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
# Ruff cobre erros objetivos de código (F* e E9*). Reformatar
# o acervo histórico inteiro não faz parte desta migração de infraestrutura.
select = ["F", "E9"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
# Todo o pacote de produção; ferramentas e arquivos científicos têm checks próprios.
# Isto verifica código, sem alterar parâmetros científicos congelados.
include = ["stocks_predictor"]
extraPaths = ["stocks_predictor"]
reportArgumentType = "error"

[tool.coverage.run]
source = ["stocks_predictor"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 77

[tool.uv.sources]
predictor-core = { url = "https://github.com/leonardosovienski/core-predictor/releases/download/v3.2.1/predictor_core-3.2.1-py3-none-any.whl" }
