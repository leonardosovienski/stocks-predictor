name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project and dev dependencies
        run: uv sync --all-extras --python 3.13
      - name: Ruff
        run: uv run ruff check stocks_predictor tests main.py
      - name: Pyright
        run: uv run pyright
      - name: Tests
        run: uv run coverage run -m pytest -q
      - name: Coverage report
        run: uv run coverage report --fail-under=0
      - name: Build wheel
        run: uv build
      - name: Wheel smoke outside checkout
        run: |
          uv venv /tmp/stocks-wheel --python 3.13 --seed
          /tmp/stocks-wheel/bin/pip install dist/*.whl \
            "predictor-core @ https://github.com/leonardosovienski/core-predictor/releases/download/v3.2.0/predictor_core-3.2.0-py3-none-any.whl"
          /tmp/stocks-wheel/bin/python -c "import predictor_core, stocks_predictor.rj_episodes, stocks_predictor.rj_judge"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
