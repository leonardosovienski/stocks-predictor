name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and dev dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Offline runtime metadata check
        run: uv run --no-sync python main.py doctor --check
      - name: Ruff
        run: uv run --no-sync ruff check stocks_predictor tests main.py tools/data_bank.py tools/benchmark_ingestion.py research/session-20260909/data_completion research/session-20260910/integral research/session-20260910/profit_validation
      - name: Pyright
        run: uv run --no-sync pyright --pythonversion ${{ matrix.python }}
      - name: Audit receipt identities
        run: uv run --no-sync python research/session-20260910/integral/verify_audit.py
      - name: Tests
        run: uv run --no-sync coverage run -m pytest -q --durations=15 --junitxml=test-results.xml
      - name: Coverage report
        run: |
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync coverage report
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-python-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Build wheel
        run: uv build
      - name: Wheel smoke outside checkout
        run: |
          uv venv /tmp/stocks-wheel --python ${{ matrix.python }} --seed
          /tmp/stocks-wheel/bin/pip install dist/*.whl \
            "predictor-core @ https://github.com/leonardosovienski/core-predictor/releases/download/v3.2.0/predictor_core-3.2.0-py3-none-any.whl"
          mkdir -p "$RUNNER_TEMP/stocks-wheel-smoke"
          cd "$RUNNER_TEMP/stocks-wheel-smoke"
          /tmp/stocks-wheel/bin/python -I - <<'PY'
          import os
          from pathlib import Path
          import sys
          import predictor_core
          import stocks_predictor
          import stocks_predictor.rj_episodes
          import stocks_predictor.rj_judge
          import stocks_predictor.etf_hold
          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert not Path.cwd().resolve().is_relative_to(checkout)
          for module in (predictor_core, stocks_predictor, stocks_predictor.etf_hold):
              origin = Path(module.__file__).resolve()
              assert origin.is_relative_to(Path(sys.prefix).resolve()), origin
              assert not origin.is_relative_to(checkout), origin
              print(module.__name__, origin)
          PY

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
