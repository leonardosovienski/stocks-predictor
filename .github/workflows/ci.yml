name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Historical R7 code receipts remain anchored to their original commit.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and dev dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Offline runtime metadata check
        run: uv run --no-sync python main.py doctor --check
      - name: Ruff
        run: uv run --no-sync ruff check stocks_predictor tests main.py tools/data_bank.py tools/benchmark_ingestion.py tools/benchmark_real_ingestion.py tools/materialize_source_revision.py tools/reproducible_build.py tools/audit_registry.py tools/operational_validation.py tools/verify_operational_evidence.py research/session-20260909/data_completion research/session-20260910/integral research/session-20260910/profit_validation research/session-20260910/gap_resolution
      - name: Pyright
        run: uv run --no-sync pyright --pythonversion ${{ matrix.python }}
      - name: Audit receipt identities
        run: uv run --no-sync python research/session-20260910/integral/verify_audit.py
      - name: Recovered package and R6 evidence identities
        run: uv run --no-sync python research/session-20260910/gap_resolution/verify.py
      - name: Archived evidence regressions
        env:
          PYTHONPATH: stocks_predictor:research/session-20260908/chat-review:research/session-20260908/h20-profit-test
        run: uv run --no-sync pytest -q --import-mode=importlib research/session-20260908/chat-review/test_h20_evidence_integrity.py research/session-20260908/h20-profit-test/test_h20_profit_comparison.py
      - name: Consolidated R7 inventory and evidence
        run: uv run --no-sync python tools/audit_registry.py
      - name: Current R8 operational evidence identities
        run: uv run --no-sync python tools/verify_operational_evidence.py
      - name: Tests
        run: uv run --no-sync coverage run -m pytest -q --durations=15 --junitxml=test-results.xml
      - name: Coverage report
        run: |
          uv run --no-sync coverage json -o coverage.json
          uv run --no-sync coverage report
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-python-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Install build tools from hashes
        run: |
          uv pip install --python .venv/bin/python --require-hashes --no-deps --only-binary :all: -r tools/build-requirements.txt
      - name: Build identical distributions twice
        run: uv run --no-sync python tools/reproducible_build.py
      - name: Retain distribution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: |
            dist/*
            build-receipt.json
          retention-days: 30
      - name: Wheel smoke outside checkout
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/stocks-runtime.txt"
          uv venv /tmp/stocks-wheel --python ${{ matrix.python }}
          uv pip install --python /tmp/stocks-wheel/bin/python --require-hashes --no-deps -r "$RUNNER_TEMP/stocks-runtime.txt"
          uv pip install --python /tmp/stocks-wheel/bin/python --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/stocks-wheel-smoke"
          cp tools/operational_validation.py "$RUNNER_TEMP/stocks-wheel-smoke/operational_validation.py"
          cd "$RUNNER_TEMP/stocks-wheel-smoke"
          /tmp/stocks-wheel/bin/python -I -m stocks_predictor doctor --check
          /tmp/stocks-wheel/bin/python -I operational_validation.py --installed --output "$RUNNER_TEMP/stocks-wheel-smoke/load" --rows 250000
          /tmp/stocks-wheel/bin/python -I - <<'PY'
          import os
          from pathlib import Path
          import sys
          import predictor_core
          import stocks_predictor
          import stocks_predictor.rj_episodes
          import stocks_predictor.rj_judge
          import stocks_predictor.etf_hold
          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert not Path.cwd().resolve().is_relative_to(checkout)
          for module in (predictor_core, stocks_predictor, stocks_predictor.etf_hold):
              origin = Path(module.__file__).resolve()
              assert origin.is_relative_to(Path(sys.prefix).resolve()), origin
              assert not origin.is_relative_to(checkout), origin
              print(module.__name__, origin)
          PY
      - name: Retain installed operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-python-${{ matrix.python }}
          path: ${{ runner.temp }}/stocks-wheel-smoke/load/validation.json
          retention-days: 30
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan the complete tracked tree including merged code
        run: |
          mkdir "$RUNNER_TEMP/stocks-secret-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/stocks-secret-scan"
          count=$(git ls-files | wc -l)
          test "$count" -gt 0
          echo "Scanning the complete tracked tree: $count files at $(git rev-parse HEAD)"
          /tmp/gitleaks-8.24.3/gitleaks detect --no-git --config .gitleaks.toml --source "$RUNNER_TEMP/stocks-secret-scan" --redact --exit-code=2 --report-format=sarif --report-path="$RUNNER_TEMP/stocks-current-tree.sarif"
      - name: Prove an exempted file still detects a synthetic token
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import secrets
          target = Path(os.environ['RUNNER_TEMP']) / 'stocks-secret-scan/stocks_predictor/trials_gate.py'
          with target.open('a', encoding='utf-8') as stream:
              stream.write('\napi_key = "' + secrets.token_urlsafe(32) + '"\n')
          PY
          set +e
          /tmp/gitleaks-8.24.3/gitleaks detect --no-git --config .gitleaks.toml --source "$RUNNER_TEMP/stocks-secret-scan" --redact --exit-code=2 --report-format=sarif --report-path="$RUNNER_TEMP/stocks-scan-control.sarif"
          result=$?
          set -e
          test "$result" -eq 2
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'stocks-scan-control.sarif').read_text())
          findings = report['runs'][0]['results']
          assert any(item['ruleId'] == 'generic-api-key' and item['locations'][0]['physicalLocation']['artifactLocation']['uri'].endswith('/stocks_predictor/trials_gate.py') for item in findings)
          print('PASS: a synthetic credential is detected in the file with an exact import exception')
          PY
      - name: Retain complete tree scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-tree-secrets
          path: |
            ${{ runner.temp }}/stocks-current-tree.sarif
            ${{ runner.temp }}/stocks-scan-control.sarif
          retention-days: 30
          if-no-files-found: error
