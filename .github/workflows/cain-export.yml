name: Cain report exporter
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  report-export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/test_export_cain_status.py
      - run: python -m py_compile tools/export_cain_status.py

      - name: Checkout exact independent interchange contracts
        uses: actions/checkout@v7
        with:
          repository: leonardosovienski/ecosystem-predictor
          ref: a9f6594c840482419d6c310f373813e0e71f17d0
          path: .interchange-contracts
      - name: Bundle and selector regressions using canonical sources
        env:
          PYTHONPATH: .interchange-contracts/packages/research-snapshot/src:.interchange-contracts/packages/research-bundle/src
        run: |
          python tools/test_export_cain_bundle.py
          python tools/test_cain_bundle_selection.py
