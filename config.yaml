# predictor-stocks — configuração. Parâmetros da H1 fixados a priori.
# NÃO alterar valores marcados [H1-FROZEN] após qualquer rodada de resultado.

universe:
  top_n: 60                        # [H1-FROZEN] top N por liquidez
  lookback_trading_days: 126       # [H1-FROZEN] janela de liquidez (~6 meses)
  min_history_days: 252            # [H1-FROZEN] mínimo de pregões para momentum
  rebalance_frequency: monthly     # [H1-FROZEN]

factor:
  name: momentum_12_1              # [H1-FROZEN]
  lookback_days: 252               # [H1-FROZEN] 12 meses
  skip_days: 21                    # [H1-FROZEN] excluir último mês (reversão curto prazo)

portfolio:
  quantile: top_quintile           # [H1-FROZEN] quintil superior = 12 papéis com N=60
  weighting: equal                 # [H1-FROZEN]
  direction: long_only             # [H1-FROZEN]

execution:
  price: next_open                 # [H1-FROZEN] abertura D+1
  b3_fee_pct: 0.0003               # [H1-FROZEN] emolumentos + liquidação
  brokerage_pct: 0.0000            # [H1-FROZEN]
  spread_slippage_pct: 0.0015      # [H1-FROZEN] por lado (conservador)
  # total roundtrip ≈ 0.36%

backtest:
  warmup_end: "2017-12-31"         # [H1-FROZEN]
  test_start: "2018-01-01"         # [H1-FROZEN]
  purge_embargo_months: 1          # [H1-FROZEN]

bootstrap:
  n_boot: 10000                    # [H1-FROZEN]
  block_length: 21                 # [H1-FROZEN] pregões (~1 mês)
  method: stationary               # H1 pré-registra stationary (Politis-Romano); core v1.1.0 suporta
  confidence: 0.95                 # [H1-FROZEN]
  seed: 42

jump_detector:
  threshold_abs: 0.30              # |retorno overnight| > 30% → quarentena

# ── H2 (pré-registrada 2026-07-16; ver HANDOFF) ─────────────────────────────
# NÃO alterar valores [H2-FROZEN] após qualquer rodada de resultado da H2.
# Universo/execução/backtest/bootstrap são COMPARTILHADOS com a H1 (mesmos
# valores acima) — reuso declarado, não repescagem.

h2_factor:
  name: realized_vol_252           # [H2-FROZEN] anomalia de baixa volatilidade
  lookback_days: 252               # [H2-FROZEN] desvio-padrão dos retornos diários, 12 meses

h2_portfolio:
  quantile: bottom_quintile        # [H2-FROZEN] quintil INFERIOR de vol = 12 papéis com N=60
  weighting: equal                 # [H2-FROZEN]
  direction: long_only             # [H2-FROZEN]

h2_criteria:
  dsr_min: 0.95                    # [H2-FROZEN] DSR mínimo (desconto por tentativas)
  trials_path: "trials.json"       # Experiment Registry (versionado de propósito)

# ── H4 (pré-registrada 2026-07-18; ver HANDOFF) ─────────────────────────────
# NÃO alterar valores [H4-FROZEN] após qualquer rodada de resultado da H4.
# Sizing, não seleção: universo INTEIRO com peso ∝ 1/vol realizada.

h4_weighting:
  name: inverse_vol                # [H4-FROZEN] volatility targeting (design §10, mapa M7+)
  vol_lookback_days: 252           # [H4-FROZEN] mesma régua da H2 (reuso declarado)

h4_criteria:
  dsr_min: 0.95                    # [H4-FROZEN] DSR mínimo (N=3 tentativas)
  require_maxdd_not_worse: true    # [H4-FROZEN] "julgado por Sharpe E drawdown" (§10)

# ── H5 (pré-registrada 2026-07-18; ver HANDOFF) ─────────────────────────────
# NÃO alterar valores [H5-FROZEN] após qualquer rodada de resultado da H5.
# Reversão de curto prazo: quintil INFERIOR do retorno de 21 pregões.

h5_factor:
  name: reversal_21                # [H5-FROZEN] perdedores do mês (Jegadeesh 1990)
  lookback_days: 21                # [H5-FROZEN] retorno de [asof-21, asof]
  skip_days: 0                     # [H5-FROZEN] variante clássica, sem skip

h5_portfolio:
  quantile: bottom_quintile        # [H5-FROZEN] 12 papéis com N=60
  weighting: equal                 # [H5-FROZEN]
  direction: long_only             # [H5-FROZEN]

h5_criteria:
  dsr_min: 0.95                    # [H5-FROZEN] DSR mínimo (N=4 tentativas)

# ── H6 (pré-registrada 2026-08-27; ver HANDOFF) ─────────────────────────────
# NÃO alterar valores [H6-FROZEN] após qualquer rodada de resultado da H6.
# Momentum de janela mais curta (6-1 em vez de 12-1): hipótese de que mercados
# menos líquidos/eficientes (B3) incorporam informação de momentum mais rápido
# que o clássico 12 meses — H1 (12-1) fracassou, mas isso não testa a mesma
# coisa: é uma janela distinta, não repescagem do mesmo sinal.

h6_factor:
  name: momentum_6_1               # [H6-FROZEN]
  lookback_days: 126               # [H6-FROZEN] ~6 meses
  skip_days: 21                    # [H6-FROZEN] excluir último mês (mesmo racional da H1)

h6_portfolio:
  quantile: top_quintile           # [H6-FROZEN]
  weighting: equal                 # [H6-FROZEN]
  direction: long_only             # [H6-FROZEN]

h6_criteria:
  dsr_min: 0.95                    # [H6-FROZEN] DSR mínimo (N=6 tentativas no registro)

# ── H8 (pré-registrada 2026-08-27; ver HANDOFF) ─────────────────────────────
# NÃO alterar valores [H8-FROZEN] após qualquer rodada de resultado da H8.
# Filtro duplo: top momentum ∩ baixa vol DENTRO desse subconjunto. H1
# (momentum isolado) e H2 (baixa vol isolada) fracassaram, mas a literatura
# mostra que a interseção às vezes sobrevive filtrando o momentum mais
# arriscado — hipótese distinta das duas isoladas, não combinação pós-hoc.

h8_factor:
  momentum_lookback_days: 252      # [H8-FROZEN] mesma régua da H1
  momentum_skip_days: 21           # [H8-FROZEN] mesma régua da H1
  vol_lookback_days: 252           # [H8-FROZEN] mesma régua da H2

h8_portfolio:
  momentum_quantile: 0.4           # [H8-FROZEN] top 40% do universo por momentum
  vol_quantile: 0.5                # [H8-FROZEN] metade inferior de vol DENTRO desse subconjunto
  weighting: equal                 # [H8-FROZEN]
  direction: long_only             # [H8-FROZEN]

h8_criteria:
  dsr_min: 0.95                    # [H8-FROZEN] DSR mínimo (N=6 tentativas no registro)

# ── H7 (pré-registrada 2026-09-03; ver HANDOFF) ─────────────────────────────
# NÃO alterar valores [H7-FROZEN] após qualquer rodada de resultado da H7.
# Fator de qualidade: ROE isolado (lucro líquido / patrimônio líquido), quintil
# SUPERIOR do universo, equiponderado. H1-H6/H8 esgotaram o baralho só-preço
# (momentum/vol/reversão/combinações); H7 é a primeira hipótese sobre fonte de
# dado NOVA (DFP da CVM, `stocks_predictor/ingest_cvm.py`, migração
# `0007_fundamentals`). Racional: empresas mais rentáveis (ROE alto) tendem a
# superar em janelas longas (fator "quality" clássico da literatura) — hipótese
# distinta de todas as anteriores (nenhuma usa dado contábil).

h7_factor:
  name: roe                        # [H7-FROZEN] lucro_liquido / patrimonio_liquido
  disclosure_embargo_days: 90      # [H7-FROZEN] embargo sobre ref_date (fim do exercício);
                                    # prazo regulamentar típico de entrega da DFP anual à CVM —
                                    # ref_date sozinho seria otimista/lookahead (ver ingest_cvm.py)

h7_portfolio:
  quantile: top_quintile           # [H7-FROZEN] 12 papéis com N=60
  weighting: equal                 # [H7-FROZEN]
  direction: long_only             # [H7-FROZEN]

h7_criteria:
  dsr_min: 0.95                    # [H7-FROZEN] DSR mínimo (N=7 tentativas no registro)

# ── H9 (pré-registrada 2026-09-04; ver HANDOFF) ─────────────────────────────
# NÃO alterar valores [H9-FROZEN] após qualquer rodada de resultado da H9.
# Fator de qualidade: alavancagem isolada, quintil INFERIOR (empresas menos
# endividadas — mesmo racional de tilt de qualidade/baixo risco da H2/H4,
# aplicado a dado contábil em vez de preço/vol). Mesmo dado real da H7
# (fundamentals.leverage, DFP/CVM 2018-2026, já ingerido) — não exige nova
# ingestão.

h9_factor:
  name: leverage                   # [H9-FROZEN] (passivo_total - patrimonio_liquido) / ativo_total
  disclosure_embargo_days: 90      # [H9-FROZEN] mesmo embargo da H7 (mesma fonte DFP)

h9_portfolio:
  quantile: bottom_quintile        # [H9-FROZEN] 12 papéis com N=60 (MENOR alavancagem)
  weighting: equal                 # [H9-FROZEN]
  direction: long_only             # [H9-FROZEN]

h9_criteria:
  dsr_min: 0.95                    # [H9-FROZEN] DSR mínimo (N=8 tentativas no registro)

# ── H10 (pré-registrada 2026-09-04; ver HANDOFF) ────────────────────────────
# NÃO alterar valores [H10-FROZEN] após qualquer rodada de resultado da H10.
# Filtro duplo: top ROE ∩ baixa alavancagem DENTRO desse subconjunto. H7 (ROE
# isolado) e H9 (alavancagem isolada) fracassaram, mas a literatura mostra que
# a interseção às vezes filtra o lado mais arriscado de cada fator isolado —
# mesmo racional da H8 (momentum∩baixa-vol), agora sobre as duas variáveis
# contábeis da H7/H9. Mesmo dado já ingerido, sem ingestão nova.

h10_factor:
  roe_disclosure_embargo_days: 90      # [H10-FROZEN] mesmo embargo de H7/H9
  leverage_disclosure_embargo_days: 90 # [H10-FROZEN] mesmo embargo de H7/H9

h10_portfolio:
  roe_quantile: 0.4                # [H10-FROZEN] top 40% do universo por ROE
  leverage_quantile: 0.5           # [H10-FROZEN] metade inferior de alavancagem DENTRO desse subconjunto
  weighting: equal                 # [H10-FROZEN]
  direction: long_only             # [H10-FROZEN]

h10_criteria:
  dsr_min: 0.95                    # [H10-FROZEN] DSR mínimo (N=9 tentativas no registro)

# ── H11 (pré-registrada 2026-09-04; ver HANDOFF) ────────────────────────────
# NÃO alterar valores [H11-FROZEN] após qualquer rodada de resultado da H11.
# Momentum 12-1 (mesmo sinal da H1), mas em RETORNO TOTAL (rota (a), proventos
# reinvestidos via adjust.total_return_series) em vez de só-preço — testa se
# o viés declarado no pré-registro da H1 ("omitir proventos FAVORECE momentum
# contra o benchmark") de fato inflava o resultado. Janela restrita a
# 2018-01-01 a 2022-12-31 porque a cobertura real de `dividends` (CVM/FRE)
# só é confiável nesse período (achado registrado no HANDOFF 2026-09-04) —
# 2023-2026 fica de fora até uma fonte melhor aparecer.

h11_factor:
  name: momentum_12_1              # [H11-FROZEN] mesmo sinal da H1
  lookback_days: 252               # [H11-FROZEN]
  skip_days: 21                    # [H11-FROZEN]

h11_portfolio:
  quantile: top_quintile           # [H11-FROZEN]
  weighting: equal                 # [H11-FROZEN]
  direction: long_only             # [H11-FROZEN]

h11_backtest:
  test_start: "2018-01-01"         # [H11-FROZEN] mesmo início de H1
  test_end: "2022-12-31"           # [H11-FROZEN] cobertura real de proventos termina aqui

h11_criteria:
  dsr_min: 0.95                    # [H11-FROZEN] DSR mínimo (N=10 tentativas no registro)

# ── H12 (pré-registrada 2026-09-04; ver HANDOFF) ────────────────────────────
# NÃO alterar valores [H12-FROZEN] após qualquer rodada de resultado da H12.
# Fator de qualidade: margem líquida isolada (lucro_liquido/receita_liquida),
# quintil SUPERIOR, equiponderado. Mesma fonte DFP/CVM de H7/H9/H10 (receita
# já vinha na DRE parseada desde a H7, só nunca tinha sido extraída — sem
# ingestão nova). Racional: margem é qualidade OPERACIONAL, distinta de ROE
# (que mistura alavancagem financeira via identidade contábil) — H7 (ROE) e
# H9 (alavancagem) isoladas reprovaram; H12 é a 3ª variável contábil
# independente da DFP.

h12_factor:
  name: net_margin                 # [H12-FROZEN] lucro_liquido / receita_liquida
  disclosure_embargo_days: 90      # [H12-FROZEN] mesmo embargo de H7/H9/H10

h12_portfolio:
  quantile: top_quintile           # [H12-FROZEN]
  weighting: equal                 # [H12-FROZEN]
  direction: long_only             # [H12-FROZEN]

h12_criteria:
  dsr_min: 0.95                    # [H12-FROZEN] DSR mínimo (N=11 tentativas no registro)

# ── H13 (pré-registrada 2026-09-04; ver HANDOFF) ────────────────────────────
# NÃO alterar valores [H13-FROZEN] após qualquer rodada de resultado da H13.
# Crescimento de receita líquida YoY, quintil SUPERIOR. Mesma fonte DFP/CVM
# de H7/H9/H10/H12, sem ingestão nova. PRIMEIRA hipótese de CRESCIMENTO
# testada neste domínio — H1-H12 são todas nível/valor (momentum mede
# preço, não fundamento). Racional: literatura de "growth investing"
# associa aceleração de receita a retorno futuro, mecanismo distinto.

h13_factor:
  name: revenue_growth_yoy         # [H13-FROZEN] (receita_t - receita_t-1) / receita_t-1
  disclosure_embargo_days: 90      # [H13-FROZEN] mesmo embargo de H7/H9/H10/H12

h13_portfolio:
  quantile: top_quintile           # [H13-FROZEN]
  weighting: equal                 # [H13-FROZEN]
  direction: long_only             # [H13-FROZEN]

h13_criteria:
  dsr_min: 0.95                    # [H13-FROZEN] DSR mínimo (N=12 tentativas no registro)

# ── H14 (pré-registrada 2026-09-04; ver HANDOFF) ────────────────────────────
# NÃO alterar valores [H14-FROZEN] após qualquer rodada de resultado da H14.
# Proximidade da máxima de 52 semanas (close/max(close, 252 pregões)), quintil
# SUPERIOR. Fator de preço distinto de momentum (George & Hwang 2004) — DFP
# consolidada esgotada (H7/H9/H10/H12/H13); volta ao dado só-preço, mas com
# um mecanismo novo (proximidade, não retorno acumulado).

h14_factor:
  name: near_52w_high              # [H14-FROZEN] close(asof) / max(close, lookback)
  lookback_days: 252               # [H14-FROZEN]

h14_portfolio:
  quantile: top_quintile           # [H14-FROZEN]
  weighting: equal                 # [H14-FROZEN]
  direction: long_only             # [H14-FROZEN]

h14_criteria:
  dsr_min: 0.95                    # [H14-FROZEN] DSR mínimo (N=13 tentativas no registro)

# ── H15 (pré-registrada 2026-09-04; ver HANDOFF) ────────────────────────────
# NÃO alterar valores [H15-FROZEN] após qualquer rodada de resultado da H15.
# Volume anormal (média 21d / média 252d − 1), quintil SUPERIOR. `volume_fin`
# já vive em prices_raw desde o M1 (usado só pra ranquear liquidez do
# universo), nunca como sinal de seleção — zero ingestão nova.

h15_factor:
  name: volume_surge               # [H15-FROZEN] vol_medio_curto/vol_medio_longo - 1
  short_lookback_days: 21          # [H15-FROZEN]
  long_lookback_days: 252          # [H15-FROZEN]

h15_portfolio:
  quantile: top_quintile           # [H15-FROZEN]
  weighting: equal                 # [H15-FROZEN]
  direction: long_only             # [H15-FROZEN]

h15_criteria:
  dsr_min: 0.95                    # [H15-FROZEN] DSR mínimo (N=14 tentativas no registro)

# ── H16 (pré-registrada 2026-09-04; ver HANDOFF) ────────────────────────────
# NÃO alterar valores [H16-FROZEN] após qualquer rodada de resultado da H16.
# Efeito virada-de-mês (Lakonishok & Smidt 1988): últimos last_days_of_month
# pregões do mês + primeiros first_days_of_month do mês seguinte. PRIMEIRA
# hipótese de TIMING testada neste domínio — H1-H15 são todas seleção
# transversal (QUAIS papéis); H16 testa QUANDO estar posicionado, mesmo
# universo (sem seleção por fator). Mecânica própria em backtest.run_h16,
# não usa walk_forward.

h16_factor:
  name: turn_of_month              # [H16-FROZEN]
  last_days_of_month: 1            # [H16-FROZEN] últimos N pregões do mês corrente
  first_days_of_month: 3           # [H16-FROZEN] primeiros N pregões do mês seguinte

h16_criteria:
  dsr_min: 0.95                    # [H16-FROZEN] DSR mínimo (N=15 tentativas no registro)

data:
  db_path: "data/stocks.db"
  cotahist_dir: "data/cotahist"
  reports_dir: "reports"
